steps:
  # Dockerイメージをビルド
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"

  # Artifact Registryにpush
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/it-development-sandbox-452923/${_REPO_NAME}/${_APP_NAME}:latest"]

  # Cloud Runにデプロイ
  - name: "gcr.io/cloud-builders/gcloud"
    # (このステップは変更なし)
    args:
      [
        "run",
        "deploy",
        "${_APP_NAME}",
        "--image",
        "${_REGION}-docker.pkg.dev/it-development-sandbox-452923/${_REPO_NAME}/${_APP_NAME}:latest",
        "--region",
        "${_REGION}",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--ingress",
        "internal-and-cloud-load-balancing",
        "--port",
        "8080",
        "--memory",
        "512Mi",
        "--cpu",
        "1",
        "--service-account",
        "${_SERVICE_ACCOUNT_EMAIL}",
      ]

# ビルドオプション
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1200s"

